name: Jar Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4

      - name: Projeyi kontrol et
        run: |
          echo "=== DOSYALAR ==="
          find . -maxdepth 5 -type f | sort

      - name: Fabric API sürümünü bul
        run: |
          V=$(curl -s -A "UnbraX-AFK-NPC-build" \
          'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D' \
          | jq -r '.[0].version_number')

          echo "Fabric API: $V"

          if [ -z "$V" ] || [ "$V" = "null" ]; then
            echo "Fabric API sürümü bulunamadı"
            exit 1
          fi

          echo "FABRIC_VERSION=$V" >> "$GITHUB_ENV"

      - name: JAR derle
        run: |
          gradle clean build --no-daemon -Pfabric_version="$FABRIC_VERSION"

      - name: JAR kontrol et
        run: |
          echo "=== BUILD/LIBS ==="
          ls -lah build/libs/

          JAR=$(find build/libs -type f -name "*.jar" ! -name "*-sources.jar" | head -n 1)

          if [ -z "$JAR" ]; then
            echo "JAR bulunamadı!"
            exit 1
          fi

          echo "Jar: $JAR"

          echo "=== JAR İÇERİĞİ ==="
          unzip -l "$JAR"

          unzip -l "$JAR" | grep -q "fabric.mod.json" || {
            echo "HATA: fabric.mod.json jar'da yok"
            exit 1
          }

          unzip -l "$JAR" | grep -q "UnbraXAfkNpc.class" || {
            echo "HATA: UnbraXAfkNpc.class jar'da yok"
            exit 1
          }

      - name: JAR'ı yükle
        uses: actions/upload-artifact@v4
        with:
          name: UnbraX-AFK-NPC-jar
          path: build/libs/*.jar
